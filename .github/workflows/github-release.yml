name: GitHub release

# Run by hand after the staged version has been approved on npm. It checks that
# the version is live, then tags the commit and creates the GitHub release.
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          live=$(npm view "@julianagaibler/stargazer@$version" version || true)
          if [ "$live" != "$version" ]; then
            echo "@julianagaibler/stargazer@$version is not live on npm. Approve the stage first." >&2
            exit 1
          fi
      - name: Tag and create the GitHub release
        run: |
          version="${{ steps.version.outputs.version }}"
          if [[ "$version" == *-* ]]; then flags=--prerelease; else flags=; fi
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --generate-notes $flags
        env:
          GH_TOKEN: ${{ github.token }}
