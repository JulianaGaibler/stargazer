name: Release

# Run by hand from the Actions tab once the version in package.json is the one
# to release. It checks the code, publishes to npm, deploys the docs to GitHub
# Pages, then tags the commit and creates the GitHub release.
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "Tag v$version already exists. Bump the version in package.json first." >&2
            exit 1
          fi
      - run: npm ci
      # A version with a dash, such as 0.2.0-beta.1, goes out under the `next`
      # tag so that `npm install` keeps resolving to the last stable release.
      - name: Publish to npm
        run: |
          if [[ "${{ steps.version.outputs.version }}" == *-* ]]; then tag=next; else tag=latest; fi
          npm publish --provenance --access public --tag "$tag"
        env:
          # The first publish needs this token, because npm can only trust a
          # workflow for a package that exists. After that, configure a trusted
          # publisher for this workflow on npmjs.com, then delete this line and
          # the NPM_TOKEN secret.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Tag and create the GitHub release
        run: |
          version="${{ steps.version.outputs.version }}"
          if [[ "$version" == *-* ]]; then flags=--prerelease; else flags=; fi
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --generate-notes $flags
        env:
          GH_TOKEN: ${{ github.token }}

  docs:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
