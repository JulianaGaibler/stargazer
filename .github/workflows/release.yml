name: Release

# Run by hand from the Actions tab once the version in package.json is the one
# to release. It checks the code and stages the version on npm. Nothing is live
# until a maintainer approves the stage with 2FA, see the job summary. Run the
# GitHub release workflow after that.
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  stage:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # A release build never reads or writes the dependency cache.
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "Tag v$version already exists. Bump the version in package.json first." >&2
            exit 1
          fi
      - run: npm ci
      # `npm stage publish` needs a recent npm, and the one that ships with
      # Node can be older.
      - run: npm install -g npm@11
      # A version with a dash, such as 0.6.0-beta.1, goes out under the `next`
      # tag so that `npm install` keeps resolving to the last stable release.
      # Authenticates through the trusted publisher set up for this workflow on
      # npmjs.com. There is no token.
      - name: Stage on npm
        run: |
          version="${{ steps.version.outputs.version }}"
          if [[ "$version" == *-* ]]; then tag=next; else tag=latest; fi
          npm stage publish --provenance --access public --tag "$tag"
          {
            echo "Staged **$version** of \`@julianagaibler/stargazer\`. It is not live yet."
            echo
            echo "Approve it from your machine, with 2FA:"
            echo
            echo '```sh'
            echo "npm stage list @julianagaibler/stargazer"
            echo "npm stage approve <stage-id>"
            echo '```'
            echo
            echo "Then run the GitHub release workflow to tag and release v$version."
          } >> "$GITHUB_STEP_SUMMARY"
